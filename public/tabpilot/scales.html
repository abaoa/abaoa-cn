<!DOCTYPE html>
<!--
  ==========================================================================
  scales.html — 指板音阶图（Fretboard Scale Diagram）

  跨模式通用工具：谱面模式 / 图片谱模式都能从顶栏「🎯 音阶」进入。
  选根音 + 音阶类型 + 调弦 + 把位范围，渲染可点击发声的指板，并列出音阶音与音程。
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 指板音阶图</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<style>
  main.app-main {
    display: flex; flex-direction: column; align-items: center;
    gap: 14px; padding: 18px; overflow: auto;
  }
  .wrap { width: min(820px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-lg, 16px); padding: 16px 18px;
    box-shadow: var(--sh-1, 0 8px 24px rgba(0,0,0,.12));
  }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > label { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
  .field select { min-width: 120px; }
  .field.row2 { flex-direction: row; align-items: center; gap: 8px; }
  .board-card { padding: 18px 18px 14px; overflow-x: auto; }

  /* ---- 指板网格 ---- */
  .board {
    display: grid;
    grid-template-columns: 26px repeat(var(--frets, 15), minmax(34px, 1fr));
    gap: 0;
    min-width: 520px;
    margin: 0 auto;
    user-select: none;
  }
  .corner { }
  .fretnum {
    text-align: center; font-size: 11px; color: var(--sub);
    padding: 4px 0 6px; font-variant-numeric: tabular-nums;
    position: relative;
  }
  .fretnum.mark::after {
    content: ''; position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%; background: var(--sub); opacity: .5;
  }
  .strlabel {
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: var(--sub);
    border-right: 2px solid var(--line-strong);
  }
  .cell {
    position: relative; height: 38px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
  }
  .cell.nut { border-left: 3px solid var(--ink); }
  .cell .ghost { width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); opacity: .55; }
  .dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; cursor: pointer;
    background: var(--brand-soft); color: var(--brand-strong);
    transition: transform .08s;
  }
  .dot:active { transform: scale(.9); }
  .dot.root { background: var(--brand); color: #fff; }
  .dot .deg { font-size: 10px; line-height: 1; margin-top: 1px; opacity: .85; }
  .dot .nm { line-height: 1; }

  .info { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .info h3 { margin: 0 0 8px; font-size: 13px; color: var(--sub); font-weight: 700; }
  .notes-line { display: flex; flex-wrap: wrap; gap: 6px; }
  .note-chip {
    min-width: 34px; text-align: center; padding: 5px 8px; border-radius: 9px;
    background: var(--brand-soft); color: var(--brand-strong); font-weight: 700; font-size: 13px;
  }
  .note-chip.root { background: var(--brand); color: #fff; }
  .iv-list { font-size: 13px; color: var(--ink); line-height: 1.9; font-variant-numeric: tabular-nums; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--sub); margin-top: 6px; }
  .legend .sw { display: inline-block; width: 13px; height: 13px; border-radius: 50%; vertical-align: -2px; margin-right: 5px; }
  .legend .sw.r { background: var(--brand); }
  .legend .sw.s { background: var(--brand-soft); }
  .hint { font-size: 12px; color: var(--sub); line-height: 1.6; }
  .toolbar2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <a href="tuner.html">🎛 调音</a>
      <span class="on">🎯 音阶</span>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>
  </div>
</header>

<main class="app-main">
  <div class="wrap">
    <div class="panel">
      <div class="controls">
        <div class="field">
          <label>根音</label>
          <select id="root"></select>
        </div>
        <div class="field">
          <label>音阶类型</label>
          <select id="scale"></select>
        </div>
        <div class="field">
          <label>调弦</label>
          <select id="tuning"></select>
        </div>
        <div class="field">
          <label>起始品</label>
          <select id="start">
            <option value="0">0（空弦）</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="10">10</option>
          </select>
        </div>
        <div class="field">
          <label>品数</label>
          <select id="frets">
            <option value="12">12 品</option>
            <option value="15" selected>15 品</option>
            <option value="17">17 品</option>
            <option value="22">22 品</option>
          </select>
        </div>
        <div class="field">
          <label>指板标注</label>
          <select id="label">
            <option value="degree">音级</option>
            <option value="note">音名</option>
          </select>
        </div>
      </div>
      <div class="toolbar2">
        <button class="btn sm" id="btnPlay">▶ 试听音阶</button>
        <button class="btn sm" id="btnPlayRoot">🎵 听根音</button>
      </div>
    </div>

    <div class="panel board-card">
      <div class="board" id="board"></div>
      <div class="legend">
        <span><i class="sw r"></i>根音</span>
        <span><i class="sw s"></i>音阶内音</span>
        <span class="hint">点击任意圆点可发声</span>
      </div>
    </div>

    <div class="panel info">
      <div>
        <h3>音阶音（升序）</h3>
        <div class="notes-line" id="notesLine"></div>
      </div>
      <div>
        <h3>音程结构（半音）</h3>
        <div class="iv-list" id="ivList"></div>
      </div>
    </div>
  </div>
</main>

<script src="js/music-core.js"></script>
<script src="js/scales.js"></script>
</body>
</html>
