<!DOCTYPE html>
<!--
  ==========================================================================
  progression.html — 和弦进行生成器（Chord Progression Generator）

  选调式 → 列出各级和弦 → 一键套用常用进行 / 点级数自建 → 试听（带扫弦）。
  和弦音计算见 js/progression.js，发声复用共享核心 MusicCore.playChord。
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 和弦进行</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<style>
  main.app-main { padding: 18px; align-items: flex-start; justify-content: center; }
  .pg { width: min(760px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .pg-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: 18px; }
  .pg-card h3 { margin: 0 0 14px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .pg-card h3 .em { font-size: 16px; }

  .pg-set { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end; }
  .pg-set .field { display: flex; flex-direction: column; gap: 6px; }
  .pg-set label { font-size: 11px; color: var(--sub); }
  select, .pg-set input {
    background: var(--card); color: var(--ink); border: 1px solid var(--line-strong);
    border-radius: var(--r-sm); padding: 7px 10px; font-size: 13px; outline: none;
  }
  .pg-set input { width: 80px; }

  .pg-degs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .pg-deg {
    background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r);
    padding: 10px 4px; text-align: center; cursor: pointer; transition: .15s; user-select: none;
  }
  .pg-deg:hover { border-color: var(--brand); transform: translateY(-2px); }
  .pg-deg .rn { font-size: 18px; font-weight: 800; color: var(--brand); }
  .pg-deg .nm { font-size: 13px; color: var(--ink); font-weight: 600; margin-top: 2px; }
  .pg-deg .ql { font-size: 10px; color: var(--sub); }

  .pg-presets { display: flex; flex-wrap: wrap; gap: 8px; }
  .pg-presets button { font-size: 12px; }

  .pg-seq { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
  .pg-seq .empty { color: var(--muted); font-size: 12px; }
  .pg-chip {
    display: flex; align-items: center; gap: 6px; background: var(--brand-soft); color: var(--brand-strong);
    border: 1px solid var(--brand); border-radius: var(--r-pill); padding: 6px 8px 6px 12px; font-weight: 700; font-size: 14px;
  }
  .pg-chip.play { box-shadow: 0 0 0 3px var(--ok); }
  .pg-chip .ord { font-size: 10px; opacity: .7; font-weight: 600; }
  .pg-chip .x { border: none; background: transparent; color: var(--brand-strong); cursor: pointer; font-size: 14px; padding: 0 2px; }
  .pg-chip .x:hover { color: var(--risk); }

  .pg-ctrls { display: flex; gap: 10px; margin-top: 12px; }
  .pg-ribbon { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
  .pg-ribbon b { color: var(--ink); }

  @media (max-width: 900px) { .pg-degs { grid-template-columns: repeat(4, 1fr); } }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <span class="on">🎶 进行</span>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>
  </div>
</header>

<main class="app-main">
  <div class="pg">

    <section class="pg-card">
      <h3><span class="em">🎼</span> 调式设置</h3>
      <div class="pg-set">
        <div class="field">
          <label>主音</label>
          <select id="root"></select>
        </div>
        <div class="field">
          <label>音阶</label>
          <select id="scale">
            <option value="major">大调 Major</option>
            <option value="minor">小调 Minor（自然）</option>
          </select>
        </div>
        <div class="field">
          <label>试听速度 BPM</label>
          <input id="bpm" type="number" min="40" max="240" value="80">
        </div>
      </div>
    </section>

    <section class="pg-card">
      <h3><span class="em">🧱</span> 各级和弦（点一下加入进行）</h3>
      <div class="pg-degs" id="degs"></div>
    </section>

    <section class="pg-card">
      <h3><span class="em">⭐</span> 常用进行</h3>
      <div class="pg-presets" id="presets"></div>
    </section>

    <section class="pg-card">
      <h3><span class="em">🎹</span> 当前进行</h3>
      <div class="pg-seq" id="seq"><span class="empty">还没有和弦，点上方的级数或常用进行试试</span></div>
      <div class="pg-ribbon" id="ribbon"></div>
      <div class="pg-ctrls">
        <button class="btn" id="btnPlay">▶ 播放</button>
        <button class="btn sm" id="btnStop" disabled>⏹ 停止</button>
        <button class="btn sm" id="btnClear">🗑 清空</button>
      </div>
    </section>

  </div>
</main>

<script src="js/music-core.js"></script>
<script src="js/progression.js"></script>
</body>
</html>
