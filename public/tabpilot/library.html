<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff2f7">
  <title>📚 曲库 · 谱领航 TabPilot</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/theme.js"></script>
  <style>
    .app-main { padding: 14px 16px 40px; max-width: 1180px; margin: 0 auto; }
    .lib-hero { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 16px 18px; box-shadow: var(--sh-1); margin-bottom: 16px; }
    .lib-hero h2 { margin: 0 0 4px; font-size: 18px; }
    .lib-hero p { margin: 0; color: var(--sub); font-size: 13px; }
    .lib-hero .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }
    .cur-folder { font-size: 13px; color: var(--sub); }
    .cur-folder b { color: var(--ink); }

    .lib-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 4px; }
    .lib-stats .st { background: var(--sunken); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--sub); }
    .lib-stats .st b { color: var(--ink); }

    .lib-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .search { flex: 1 1 200px; min-width: 160px; }
    .search input { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); color: var(--ink); font-size: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); background: var(--bg); color: var(--sub);
      padding: 6px 11px; border-radius: 999px; font-size: 13px; cursor: pointer; user-select: none; }
    .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
    .seg button { border: 0; background: var(--bg); color: var(--sub); padding: 6px 12px; font-size: 13px; cursor: pointer; }
    .seg button.on { background: var(--brand); color: #fff; }
    .toggle { font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .sortby { font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
    .sortby select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--bg); color: var(--ink); font-size: 13px; cursor: pointer; }
    .sortby .dir { padding: 6px 11px; font-size: 14px; min-width: 34px; }
    @media (max-width: 760px) { .sortby { margin-left: 0; } }

    .lib-filters { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .lib-filters .frow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .lib-filters .flabel { font-size: 12px; color: var(--sub); min-width: 30px; flex: 0 0 auto; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
      overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--sh-1); }
    .card .thumb { height: 120px; background: var(--sunken); display: flex; align-items: center; justify-content: center;
      overflow: hidden; }
    .card .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card .thumb .ico { font-size: 40px; }
    .card .body { padding: 9px 11px 11px; }
    .card .nm { font-size: 13px; font-weight: 600; color: var(--ink); word-break: break-all; line-height: 1.3; }
    .card .pth { font-size: 11px; color: var(--sub); margin: 3px 0 7px; word-break: break-all; }
    .card .meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .ktag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--sunken); color: var(--sub); }
    .card .open { font-size: 12px; }

    .list { display: flex; flex-direction: column; gap: 6px; }
    .lrow { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 12px; }
    .lrow .li { width: 34px; height: 34px; border-radius: 8px; background: var(--sunken); display: flex;
      align-items: center; justify-content: center; font-size: 18px; flex: 0 0 auto; }
    .lrow .li img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .lrow .info { flex: 1 1 auto; min-width: 0; }
    .lrow .nm { font-size: 14px; font-weight: 600; color: var(--ink); }
    .lrow .pth { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lrow .meta { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; }

    .group-h { margin: 18px 0 8px; font-size: 14px; color: var(--sub); font-weight: 600; }
    .group-h:first-child { margin-top: 4px; }

    .empty { text-align: center; color: var(--sub); padding: 50px 16px; }
    .empty .big { font-size: 44px; margin-bottom: 8px; }

    .recent { margin-top: 26px; }
    .recent h3 { font-size: 15px; margin: 0 0 10px; }
    .rf { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 8px 6px 14px; margin: 0 8px 8px 0; cursor: pointer; }
    .rf b { font-size: 13px; color: var(--ink); font-weight: 600; }
    .rf .x { border: 0; background: var(--sunken); color: var(--sub); width: 20px; height: 20px; border-radius: 50%;
      cursor: pointer; font-size: 12px; line-height: 1; }
    .rf:hover { border-color: var(--brand); }
    .hint-line { font-size: 12px; color: var(--sub); margin-top: 6px; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .lrow .pth { display: none; }
    }

    /* 曲库条目标注：难度 / 标签 / 按钮 */
    .card .meta .btns, .lrow .meta .btns { display: inline-flex; gap: 5px; flex-wrap: wrap; }
    .btn.ghost { background: var(--bg); }
    .btn.pr { background: var(--ok); color: #fff; border-color: var(--ok); }
    .btn.pr:hover { filter: brightness(1.05); }
    .ann { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
    .ann-inline { display: inline-flex; gap: 5px; align-items: center; margin-left: 10px; }
    .ds { color: #f5a623; font-size: 12px; letter-spacing: 1px; }
    .tchip { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--sunken); color: var(--sub); }
    .prac { font-size: 11px; color: var(--brand); margin-top: 6px; padding: 2px 8px; border-radius: 999px;
      background: color-mix(in srgb, var(--brand) 12%, transparent); display: inline-block; }
    .prac-inline { font-size: 11px; color: var(--brand); padding: 2px 8px; border-radius: 999px;
      background: color-mix(in srgb, var(--brand) 12%, transparent); }

    /* 标注弹窗 */
    .ann-body { display: flex; flex-direction: column; gap: 2px; }
    .ann-body label { font-size: 13px; color: var(--sub); margin-top: 12px; }
    .ann-body label:first-child { margin-top: 0; }
    .ann-body input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--bg); color: var(--ink); font-size: 14px; outline: none; }
    .ann-body input:focus { border-color: var(--brand); }
    .stars { display: flex; gap: 5px; font-size: 28px; cursor: pointer; user-select: none; line-height: 1; }
    .stars .star { color: var(--line-strong); transition: color .12s; }
    .stars .star.on { color: #f5a623; }
    .ann-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">📚 <b>曲库</b><span class="app-ver" id="appVer"></span></div>
    <nav class="tabs">
      <a href="index.html">🎼 谱面</a>
      <a href="image-tab.html">🖼 图片谱</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <span class="on">📚 曲库</span>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>
  </header>

  <main class="app-main">
    <section class="lib-hero">
      <h2>本地曲库扫描</h2>
      <p>选择一个文件夹，自动扫描其中的图片谱 / Guitar Pro / MusicXML / MIDI 等，按类型分类、可搜索、可打开。</p>
      <div class="row">
        <button class="btn" id="btnPick">📂 选择文件夹</button>
        <button class="btn sm" id="btnInput">↺ 用文件选择器</button>
        <span class="cur-folder" id="curFolder">尚未选择文件夹</span>
      </div>
      <div class="lib-stats" id="stats"></div>
      <div class="hint-line" id="hint">提示：优先用「选择文件夹」可记忆路径、下次直接重扫；浏览器不支持时自动改用文件选择器（需手动重选）。</div>
    </section>

    <div class="lib-toolbar">
      <div class="search"><input id="search" type="search" placeholder="🔍 搜索文件名 / 路径…"></div>
      <div class="chips" id="chips"></div>
      <div class="seg" id="viewSeg">
        <button data-view="card" class="on">▦ 卡片</button>
        <button data-view="list">☰ 列表</button>
      </div>
      <label class="toggle"><input type="checkbox" id="groupBy"> 按文件夹分组</label>
      <label class="sortby">排序
        <select id="sortBy">
          <option value="name">名称</option>
          <option value="type">类型</option>
          <option value="diff">难度</option>
          <option value="prac">练习时长</option>
        </select>
        <button id="sortDir" class="btn sm dir" title="切换升/降序">↓</button>
      </label>
    </div>

    <div class="lib-filters" id="libFilters" style="display:none">
      <div class="frow"><span class="flabel">难度</span><div class="chips" id="chipsDiff"></div></div>
      <div class="frow"><span class="flabel">标签</span><div class="chips" id="chipsTag"></div></div>
    </div>

    <div id="result"></div>

    <section class="recent">
      <h3>🕘 最近文件夹</h3>
      <div id="recent"></div>
      <div class="hint-line">点击可重新扫描该文件夹；叉号移除记录。</div>
    </section>
  </main>

  <script src="js/library.js"></script>
</body>
</html>
