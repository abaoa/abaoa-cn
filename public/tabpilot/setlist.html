<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eff2f7">
  <title>🎵 练习歌单 · 谱领航 TabPilot</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <script src="js/theme.js"></script>
  <style>
    .app-main { padding: 14px 16px 40px; max-width: 980px; margin: 0 auto; }

    .sl-hero { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 16px 18px; box-shadow: var(--sh-1); margin-bottom: 16px; }
    .sl-hero h2 { margin: 0 0 4px; font-size: 18px; }
    .sl-hero p { margin: 0; color: var(--sub); font-size: 13px; line-height: 1.5; }
    .sl-hero .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 12px; }

    .sl-progress { margin-top: 12px; }
    .sl-progress .bar { height: 10px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
    .sl-progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--brand));
      transition: width .25s ease; }
    .sl-progress .lab { font-size: 12px; color: var(--sub); margin-top: 6px; }
    .sl-progress .lab b { color: var(--ink); }

    .sl-toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-bottom: 14px; }
    .sl-add { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; flex: 1 1 auto; }
    .sl-field { display: flex; flex-direction: column; gap: 3px; }
    .sl-field label { font-size: 11px; color: var(--sub); }
    .sl-field input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--bg); color: var(--ink); font-size: 13px; outline: none; }
    .sl-field input:focus { border-color: var(--brand); }
    .sl-field.title { flex: 1 1 160px; }
    .sl-field.bpm { width: 96px; }
    .sl-field.bpm input { text-align: center; }

    .sl-list { display: flex; flex-direction: column; gap: 10px; }
    .sl-item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 10px 12px; box-shadow: var(--sh-1); transition: border-color .15s, opacity .15s; }
    .sl-item.done { opacity: .62; }
    .sl-item.done .sl-title { text-decoration: line-through; color: var(--sub); }

    .sl-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .sl-move { display: inline-flex; flex-direction: column; gap: 2px; }
    .sl-move button { border: 1px solid var(--line); background: var(--bg); color: var(--sub);
      width: 22px; height: 18px; border-radius: 6px; font-size: 11px; line-height: 1; cursor: pointer; padding: 0; }
    .sl-move button:hover { border-color: var(--brand); color: var(--brand); }
    .sl-move button:disabled { opacity: .35; cursor: default; }

    .sl-done { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line-strong);
      background: var(--bg); color: var(--sub); cursor: pointer; font-size: 13px; line-height: 1; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .sl-done.on { background: var(--ok); border-color: var(--ok); color: #fff; }

    .sl-info { flex: 1 1 180px; min-width: 140px; }
    .sl-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.3; word-break: break-word; }
    .sl-artist { font-size: 12px; color: var(--sub); margin-top: 1px; }
    .sl-kind { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--sunken); color: var(--sub);
      margin-left: 6px; vertical-align: middle; }

    .sl-bpm { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--sub);
      background: var(--sunken); border-radius: 999px; padding: 4px 10px; }
    .sl-bpm input { width: 48px; border: 0; background: transparent; color: var(--ink); font-size: 13px;
      font-weight: 600; text-align: center; outline: none; }
    .sl-actions { display: inline-flex; gap: 6px; flex-wrap: wrap; }

    .sl-sub { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; align-items: center; }
    .sl-sub select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--bg); color: var(--ink); font-size: 12px; cursor: pointer; }
    .sl-sub input { flex: 1 1 160px; min-width: 120px; padding: 6px 10px; border: 1px solid var(--line);
      border-radius: 9px; background: var(--bg); color: var(--ink); font-size: 12px; outline: none; }
    .sl-sub input:focus, .sl-sub select:focus { border-color: var(--brand); }

    .sl-foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
    .sl-foot .sp { flex: 1 1 auto; }

    .empty { text-align: center; color: var(--sub); padding: 46px 16px; }
    .empty .big { font-size: 42px; margin-bottom: 8px; }
    .empty a { color: var(--brand); }

    @media (max-width: 760px) {
      .sl-row { gap: 8px; }
      .sl-info { flex-basis: 100%; order: 3; }
      .sl-actions { order: 4; width: 100%; }
      .sl-bpm { order: 2; }
      .sl-move { order: 1; }
      .sl-done { order: 0; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">🎵 <b>练习歌单</b><span class="app-ver" id="appVer"></span></div>
    <nav class="tabs">
      <a href="index.html">🎼 谱面</a>
      <a href="image-tab.html">🖼 图片谱</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
      <span class="on">🎵 歌单</span>
    </nav>
  </header>

  <main class="app-main">
    <section class="sl-hero">
      <h2>练习歌单 · 把想练的曲子排成一份清单</h2>
      <p>从「曲库」或「找谱」点 <b>＋歌单</b> 加入，或手动添加。给每首设目标速度、难度与备注，勾掉已练会的，一键跳到练习中心或节拍器开练。</p>
      <div class="row">
        <button class="btn" id="btnAdd">＋ 添加曲目</button>
        <span class="cur-folder" id="cntHint">歌单为空</span>
      </div>
      <div class="sl-progress" id="prog" style="display:none">
        <div class="bar"><div class="fill" id="progFill"></div></div>
        <div class="lab" id="progLab"></div>
      </div>
    </section>

    <div class="sl-toolbar" id="addBar" style="display:none">
      <div class="sl-add">
        <div class="sl-field title"><label>曲目名 *</label><input id="addTitle" placeholder="如：Hotel California"></div>
        <div class="sl-field"><label>艺术家</label><input id="addArtist" placeholder="可选"></div>
        <div class="sl-field bpm"><label>目标 BPM</label><input id="addBpm" type="number" min="40" max="240" placeholder="—"></div>
        <button class="btn primary" id="addBtn">＋ 加入</button>
        <button class="btn sm" id="addCancel">取消</button>
      </div>
    </div>

    <div class="sl-list" id="list"></div>

    <div class="empty" id="empty">
      <div class="big">🎵</div>
      <div>歌单还是空的。</div>
      <div>去 <a href="library.html">📚 曲库</a> 或 <a href="find.html">🔎 找谱</a> 点曲子上的「＋歌单」，或点上方「添加曲目」手动建一份练习清单。</div>
    </div>

    <div class="sl-foot" id="foot" style="display:none">
      <span class="sp"></span>
      <button class="btn sm" id="clearDone">清除已勾选</button>
      <button class="btn sm ghost" id="clearAll">清空歌单</button>
    </div>
  </main>

  <script src="js/setlist.js"></script>
</body>
</html>
