<!DOCTYPE html>
<!--
  ==========================================================================
  tempo.html — 渐进提速器（Tempo Trainer）

  练曲提速必备：从起始 BPM 起步，每 N 拍自动加上步长，直到目标 BPM。
  点击声用 Web Audio 前瞻调度（25ms 轮询 / 120ms 预排），重拍音色区分。
  逻辑见 js/tempo.js。
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 渐进提速器</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<style>
  main.app-main { padding: 24px; align-items: flex-start; justify-content: center; }
  .tp { width: min(520px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .tp-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg);
    box-shadow: var(--sh-1); padding: 22px 20px;
  }
  .tp-bpm { text-align: center; }
  .tp-bpm .big { font-size: 84px; font-weight: 800; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
  .tp-bpm .lbl { font-size: 12px; color: var(--sub); margin-top: 4px; letter-spacing: 2px; }
  .tp-beat { display: flex; gap: 8px; justify-content: center; margin: 16px 0 4px; height: 14px; }
  .tp-beat i { width: 12px; height: 12px; border-radius: 50%; background: var(--line-strong); transition: background .05s, transform .05s; }
  .tp-beat i.on { background: var(--brand); transform: scale(1.25); }
  .tp-beat i.accent.on { background: var(--ok); }

  .tp-prog { margin: 10px 2px 0; }
  .meter { height: 10px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--ok)); border-radius: 99px; transition: width .25s; }

  .tp-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tp-field { background: var(--sunken); border-radius: var(--r); padding: 10px 12px; }
  .tp-field label { font-size: 11px; color: var(--sub); display: block; margin-bottom: 6px; }
  .tp-field .v { display: flex; align-items: center; gap: 6px; }
  .tp-field input { width: 100%; background: var(--card); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 7px 9px; font-size: 16px; font-weight: 700; text-align: center; outline: none; font-variant-numeric: tabular-nums; }
  .tp-field input:focus { border-color: var(--brand); }
  .tp-field .u { font-size: 12px; color: var(--muted); }

  .tp-ctrls { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
  .tp-status { text-align: center; font-size: 12px; color: var(--sub); min-height: 18px; margin-top: 2px; }
  .tp-status.ok { color: var(--ok); font-weight: 700; }

  @media (max-width: 900px) { .tp-form { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <span class="on">⏩ 提速</span>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>
  </div>
</header>

<main class="app-main">
  <div class="tp">
    <section class="tp-card">
      <div class="tp-bpm">
        <div class="big" id="bpm">60</div>
        <div class="lbl">当前 BPM</div>
      </div>
      <div class="tp-beat" id="beat"></div>
      <div class="tp-prog">
        <div class="meter"><i id="fill"></i></div>
      </div>
      <div class="tp-status" id="status">设置起始 / 目标速度后点「开始」</div>
    </section>

    <section class="tp-card">
      <div class="tp-form">
        <div class="tp-field">
          <label>起始 BPM</label>
          <div class="v"><input id="startBpm" type="number" min="30" max="300" value="60"><span class="u"></span></div>
        </div>
        <div class="tp-field">
          <label>目标 BPM</label>
          <div class="v"><input id="goalBpm" type="number" min="30" max="400" value="120"><span class="u"></span></div>
        </div>
        <div class="tp-field">
          <label>每多少拍提速</label>
          <div class="v"><input id="everyBeats" type="number" min="1" max="64" value="8"><span class="u">拍</span></div>
        </div>
        <div class="tp-field">
          <label>每次提速</label>
          <div class="v"><input id="stepBpm" type="number" min="1" max="20" value="2"><span class="u">BPM</span></div>
        </div>
      </div>
      <div class="tp-ctrls">
        <button class="btn" id="btnStart">▶ 开始</button>
        <button class="btn sm" id="btnReset">↺ 重置</button>
      </div>
    </section>
  </div>
</main>

<script src="js/tempo.js"></script>
</body>
</html>
