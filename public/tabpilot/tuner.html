<!DOCTYPE html>
<!--
  ==========================================================================
  tuner.html — 吉他调音器（chromatic tuner）

  跨模式通用工具：谱面模式 / 图片谱模式都能从顶栏的「🎛 调音」进入。
  麦克风测音高逻辑见 js/tuner.js，这里只负责结构与样式。
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 调音器</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<style>
  /* 调音器专属布局（中枢结构复用 base/layout/components 的设计令牌） */
  main.app-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .tuner-wrap {
    width: min(540px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg, 16px);
    padding: 30px 26px 26px;
    box-shadow: var(--sh-1, 0 8px 24px rgba(0,0,0,.12));
    text-align: center;
  }
  .t-note {
    font-size: 92px;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: color .15s;
  }
  .t-note.ok { color: var(--ok); }
  .t-note small { font-size: 34px; vertical-align: super; color: var(--sub); margin-left: 2px; }
  .tuner-freq { font-size: 18px; color: var(--sub); margin: 8px 0 24px; font-variant-numeric: tabular-nums; }
  .tuner-gauge { position: relative; height: 56px; margin: 0 12px 4px; }
  .gauge-track {
    position: absolute; left: 0; right: 0; top: 28px; height: 8px;
    background: var(--sunken); border-radius: 99px;
  }
  .gauge-center {
    position: absolute; left: 50%; top: 14px; width: 2px; height: 36px;
    background: var(--ok); transform: translateX(-50%); border-radius: 2px;
  }
  .gauge-needle {
    position: absolute; top: 10px; left: 50%; width: 4px; height: 44px; margin-left: -2px;
    background: var(--sub); border-radius: 2px; transition: left .06s linear;
  }
  .gauge-needle.warn { background: var(--warn); }
  .gauge-needle.ok { background: var(--ok); }
  .gauge-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--sub); margin-top: 2px; }
  .tuner-target { margin-top: 18px; font-size: 14px; color: var(--ink); min-height: 20px; }
  .tuner-actions { margin-top: 18px; display: flex; gap: 10px; justify-content: center; }
  .tuner-hint { margin-top: 14px; font-size: 12px; color: var(--sub); line-height: 1.6; }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <span class="on">🎛 调音</span>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>

    <div class="group">
      <span class="glabel">调弦</span>
      <select id="tuning" class="btn sm" aria-label="调弦预设">
        <option>标准 Standard</option>
        <option>Drop D</option>
        <option>DADGAD</option>
        <option>Open G</option>
        <option>Open D</option>
      </select>
      <button class="btn sm" id="btnStart">🎙 开始</button>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="tuner-wrap">
    <div class="t-note"><span id="noteName">—</span><small id="noteOct"></small></div>
    <div class="tuner-freq"><span id="freq">0</span> Hz</div>

    <div class="tuner-gauge">
      <div class="gauge-track"></div>
      <div class="gauge-center"></div>
      <div class="gauge-needle" id="needle"></div>
    </div>
    <div class="gauge-labels"><span>-50¢</span><span>准</span><span>+50¢</span></div>

    <div class="tuner-target" id="target">点「开始」对准麦克风</div>

    <div class="tuner-actions">
      <button class="btn sm" id="btnRef" disabled>🔊 听参考音</button>
    </div>

    <div class="tuner-hint">
      在安静环境拨弦；指针居中、音名变绿即对准。切换调弦预设可反推「你正在对哪根弦」，并给出该弦参考音。
    </div>
  </div>
</main>

<script src="js/tuner.js"></script>
</body>
</html>
