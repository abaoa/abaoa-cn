<!DOCTYPE html>
<!--
  ==========================================================================
  metronome.html — 节拍器（Metronome）

  纯前端工具：Web Audio 精确调度，稳定打拍。补齐「吉他练习三件套」
  （调音器 / 节拍器 / 跟练提速）。不依赖 Rust / 网络。
  逻辑见 js/metronome.js，这里只负责结构与样式。
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 节拍器</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<style>
  main.app-main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .m-wrap {
    width: min(560px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg, 16px);
    padding: 28px 26px 24px;
    box-shadow: var(--sh-1, 0 8px 24px rgba(0,0,0,.12));
    text-align: center;
  }
  .bpm-big {
    font-size: 86px;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    margin: 6px 0 2px;
  }
  .bpm-big small { font-size: 22px; color: var(--sub); font-weight: 600; }
  .bpm-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0 4px; }
  .bpm-row .step {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--sunken); color: var(--ink);
    font-size: 22px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .bpm-row .step:active { transform: scale(.92); }
  .bpm-range { width: min(360px, 80%); accent-color: var(--brand); cursor: pointer; }
  .bpm-num {
    width: 64px; padding: 6px 8px; text-align: center; font-size: 15px;
    border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink);
  }

  /* 拍点 */
  .beats { display: flex; gap: 12px; justify-content: center; margin: 22px 0 8px; min-height: 26px; }
  .beat {
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--sunken); border: 1px solid var(--line);
    transition: transform .07s ease, background .07s ease;
  }
  .beat.accent { box-shadow: inset 0 0 0 2px var(--warn, #f5a623); }
  .beat.on { background: var(--brand); border-color: var(--brand); transform: scale(1.3); }
  .beat.on.accent-flash { background: var(--warn, #f5a623); border-color: var(--warn, #f5a623); }
  .sub-row { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 14px; margin-bottom: 8px; }
  .sub-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); opacity: .25; transition: opacity .05s; }
  .sub-dot.pulse { opacity: 1; transform: scale(1.5); }

  /* 控制 */
  .controls { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  .play-btn {
    min-width: 140px; padding: 12px 20px; font-size: 17px; font-weight: 700;
    border-radius: 12px; border: 1px solid var(--line);
    background: var(--brand); color: #fff; cursor: pointer;
  }
  .play-btn.on { background: var(--warn, #f5a623); color: #1a1206; }
  .tap-btn {
    padding: 12px 18px; font-size: 15px; font-weight: 600; border-radius: 12px;
    border: 1px solid var(--line); background: var(--sunken); color: var(--ink); cursor: pointer;
  }
  .tap-btn:active { transform: scale(.95); }

  .opts { display: flex; gap: 22px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .opt { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
  .opt select {
    padding: 6px 10px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--bg); color: var(--ink); font-size: 14px; cursor: pointer;
  }
  .hint { margin-top: 16px; font-size: 12px; color: var(--sub); line-height: 1.6; }
  @media (max-width: 620px) {
    .bpm-big { font-size: 70px; }
    .beats { gap: 9px; }
    .beat { width: 20px; height: 20px; }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <span class="on">🎚 节拍器</span>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>
    <div class="group"><span class="glabel">节拍器</span></div>
  </div>
</header>

<main class="app-main">
  <div class="m-wrap">
    <div class="bpm-big" id="bpmBig">100<small> BPM</small></div>
    <div class="bpm-row">
      <button class="step" id="bpmMinus" aria-label="减速">−</button>
      <input type="range" class="bpm-range" id="bpmRange" min="40" max="240" value="100" step="1">
      <button class="step" id="bpmPlus" aria-label="加速">+</button>
      <input type="number" class="bpm-num" id="bpmNum" min="40" max="240" value="100" step="1">
    </div>

    <div class="beats" id="beats"></div>
    <div class="sub-row"><span class="sub-dot" id="subDot"></span></div>

    <div class="controls">
      <button class="play-btn" id="btnPlay">▶ 开始</button>
      <button class="tap-btn" id="btnTap">👆 敲(Tap)</button>
    </div>

    <div class="opts">
      <div class="opt">
        <span>拍号（每小节拍数）</span>
        <select id="beatsSel">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="9">9</option>
          <option value="12">12</option>
        </select>
      </div>
      <div class="opt">
        <span>细分</span>
        <select id="subSel">
          <option value="1" selected>四分（每拍1击）</option>
          <option value="2">八分（每拍2击）</option>
          <option value="3">三连音（每拍3击）</option>
          <option value="4">十六分（每拍4击）</option>
        </select>
      </div>
    </div>

    <div class="hint">
      开始即稳定打拍；重拍（小节第 1 拍）音色更高更亮。用「敲」连点两下以上可测出当前速度，或直接拖滑块 / 改数字。<br>
      快捷键：<b>空格</b> 开始 / 停止。配合「📅 练习」计时打卡，练准节奏再提速。
    </div>
  </div>
</main>

<script src="js/metronome.js"></script>
</body>
</html>
