<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<title>谱领航 TabPilot · 和弦指法库</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
</head>
<body>

<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <a href="practice.html">📅 练习</a>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <span class="on">🎸 指法</span>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>
    <span class="app-ver">v1.0.0</span>
  </div>
</header>

<main class="app-main" style="padding:18px;align-items:stretch">
  <section class="panel" style="max-width:920px;margin:0 auto;width:100%">
    <h2 style="margin:0 0 4px">🎸 和弦指法库</h2>
    <p class="pm-sub">选根音与性质，查看常用把位指法图（横按 / 开放）。点图可试听。和弦反查与进行生成器里也能直接跳过来。</p>

    <div class="group" style="flex-wrap:wrap;gap:10px;margin:14px 0">
      <span class="glabel">根音</span>
      <select id="root" class="sel" aria-label="根音"></select>
      <span class="glabel">性质</span>
      <select id="quality" class="sel" aria-label="和弦性质"></select>
      <button class="btn" id="btnHear">🔊 试听</button>
    </div>

    <div id="quick" class="notes-line" style="justify-content:flex-start;margin-bottom:10px"></div>

    <div class="result" style="text-align:left;padding:6px 0">
      <div class="big" id="chordName" style="font-size:42px">C</div>
      <div class="sub2" id="chordSub"></div>
      <div class="notes-line" id="notesLine" style="justify-content:flex-start;margin-top:10px"></div>
    </div>

    <div id="diagrams" class="diag-grid"></div>
    <p class="pm-sub" id="noShape" style="display:none">该和弦暂无收录常用把位图，已按音构成给出试听。</p>
  </section>
</main>

<style>
  .sel { background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px; }
  .notes-line { display:flex;flex-wrap:wrap;gap:6px; }
  .note-chip { min-width:30px;text-align:center;padding:4px 8px;border-radius:9px;background:var(--brand-soft);color:var(--brand-strong);font-weight:700;font-size:13px; }
  .note-chip.root { background:var(--brand);color:#fff; }
  .quick-chip { cursor:pointer;user-select:none;padding:5px 10px;border-radius:999px;background:var(--sunken);color:var(--ink);border:1px solid var(--line);font-size:13px;font-weight:600; }
  .quick-chip:hover { border-color:var(--brand);color:var(--brand-strong); }
  .diag-grid { display:flex;flex-wrap:wrap;gap:18px;margin-top:16px; }
  .diag-card { background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;box-shadow:var(--sh-1);cursor:pointer;transition:transform .12s ease,border-color .12s ease; }
  .diag-card:hover { transform:translateY(-2px);border-color:var(--brand); }
  .diag-card .dc-label { text-align:center;font-size:12px;color:var(--sub);margin-top:6px;font-weight:600; }
  .diag-card svg { display:block; }
</style>

<script src="js/music-core.js"></script>
<script src="js/chord-core.js"></script>
<script src="js/chords.js"></script>
</body>
</html>
