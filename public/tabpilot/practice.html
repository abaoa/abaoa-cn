<!DOCTYPE html>
<!--
  ==========================================================================
  practice.html — 练习中心（每日打卡 / 练习计时 / 统计）

  跨模式通用工具。数据存 localStorage（key: tabpilot_practice_v1），
  纯前端、无后端依赖。逻辑见 js/practice.js。
  ==========================================================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-512.png">
<title>谱领航 TabPilot · 练习中心</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script src="js/theme.js"></script>
<style>
  main.app-main { padding: 18px; align-items: flex-start; justify-content: center; }
  .pc { width: min(760px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .pc-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--sh-1);
    padding: 18px 18px 16px;
  }
  .pc-card h3 { margin: 0 0 14px; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .pc-card h3 .em { font-size: 16px; }

  /* 今日概览 */
  .pc-today { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .pc-streak { text-align: center; flex: 0 0 auto; }
  .pc-streak b { font-size: 40px; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
  .pc-streak span { display: block; font-size: 11px; color: var(--sub); margin-top: 4px; }
  .pc-prog { flex: 1 1 220px; min-width: 200px; }
  .pc-prog .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--sub); margin-bottom: 6px; }
  .pc-prog .row b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .meter { height: 12px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
  .meter > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--brand-strong)); border-radius: 99px; transition: width .4s ease; }
  .meter.ok > i { background: linear-gradient(90deg, var(--ok), #0e8a5b); }

  /* 计时器 */
  .pc-timer { text-align: center; }
  .pc-clock { font-size: 56px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 1px; }
  .pc-clock.run { color: var(--brand); }
  .pc-timer .ctrls { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .pc-note { margin-top: 12px; display: flex; gap: 8px; align-items: center; }
  .pc-note input { flex: 1; }

  /* 统计四宫格 */
  .pc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .pc-stat { background: var(--sunken); border-radius: var(--r); padding: 12px 10px; text-align: center; }
  .pc-stat b { display: block; font-size: 22px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pc-stat span { font-size: 11px; color: var(--sub); }

  /* 30 天柱状图 */
  .pc-bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding-top: 6px; }
  .pc-bar { flex: 1 1 0; min-width: 0; background: var(--line-strong); border-radius: 3px 3px 0 0; position: relative; transition: background .2s; }
  .pc-bar.has { background: var(--brand); }
  .pc-bar.today { background: var(--ok); }
  .pc-bar.empty { background: var(--sunken); }
  .pc-bar:hover::after {
    content: attr(data-tip); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 10px; padding: 3px 6px; border-radius: 5px; white-space: nowrap; margin-bottom: 4px;
  }
  .pc-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 6px; }

  /* 最近记录 */
  .pc-log { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .pc-log .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; }
  .pc-li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--sunken); border-radius: var(--r); }
  .pc-li .d { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; min-width: 92px; }
  .pc-li .m { font-size: 13px; color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 56px; }
  .pc-li .nt { flex: 1; font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-li .rm { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 6px; }
  .pc-li .rm:hover { color: var(--risk); background: var(--panel); }

  input[type='number'], input[type='text'] {
    background: var(--card); color: var(--ink); border: 1px solid var(--line-strong);
    border-radius: var(--r-sm); padding: 6px 9px; font-size: 13px; outline: none;
  }
  input:focus { border-color: var(--brand); }

  /* 曲目下拉 + 曲目练习统计 */
  .pc-note input[list] { flex: 1; }
  .pc-songs { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .pc-songs .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; }
  .pc-song-li { display: flex; align-items: center; gap: 10px; padding: 9px 11px; background: var(--sunken); border-radius: var(--r); }
  .pc-song-li .nm { flex: 1; font-size: 13px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pc-song-li .nm .rk { color: var(--brand); font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .pc-song-li .t { font-size: 13px; color: var(--brand); font-weight: 700; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
  .pc-song-li .c { font-size: 11px; color: var(--sub); min-width: 52px; text-align: right; }
  .pc-song-li .go-lib { flex: 0 0 auto; border: 1px solid var(--line); background: var(--bg); color: var(--brand);
    font-size: 12px; padding: 4px 9px; border-radius: 8px; cursor: pointer; }
  .pc-song-li .go-lib:hover { border-color: var(--brand); }

  @media (max-width: 900px) {
    .pc-stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="topbar">
    <div class="brand">🎸 谱领航 <span class="tag">TabPilot</span></div>

    <nav class="tabs">
      <a href="index.html">🎼 谱面模式</a>
      <a href="image-tab.html">🖼 图片谱模式</a>
      <a href="tuner.html">🎛 调音</a>
      <a href="scales.html">🎯 音阶</a>
      <a href="chordfinder.html">🎹 和弦</a>
      <a href="eargame.html">👂 练耳</a>
      <span class="on">📅 练习</span>
      <a href="tempo.html">⏩ 提速</a>
      <a href="metronome.html">🎚 节拍器</a>
      <a href="progression.html">🎶 进行</a>
      <a href="chords.html">🎸 指法</a>
      <a href="sheet.html">📝 和弦谱</a>
      <a href="library.html">📚 曲库</a>
      <a href="find.html">🔎 找谱</a>
    <a href="setlist.html">🎵 歌单</a>
    </nav>

    <div class="spacer"></div>

    <div class="group">
      <span class="glabel">今日目标</span>
      <input id="goal" type="number" min="5" max="600" step="5" style="width:64px" aria-label="今日目标分钟">
      <span style="align-self:center;color:var(--sub);font-size:12px">分</span>
    </div>
  </div>
</header>

<main class="app-main">
  <div class="pc">

    <!-- 今日概览 -->
    <section class="pc-card">
      <h3><span class="em">🔥</span> 今日概览</h3>
      <div class="pc-today">
        <div class="pc-streak">
          <b id="streak">0</b>
          <span>连续打卡(天)</span>
        </div>
        <div class="pc-prog">
          <div class="row"><span>今日练习</span><span><b id="todayMin">0</b> / <b id="goalMin">30</b> 分</span></div>
          <div class="meter" id="goalMeter"><i id="goalFill"></i></div>
          <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
            <button class="btn sm" id="btnCheck">✅ 打卡</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 练习计时 -->
    <section class="pc-card">
      <h3><span class="em">⏱</span> 练习计时</h3>
      <div class="pc-timer">
        <div class="pc-clock" id="clock">00:00</div>
        <div class="ctrls">
          <button class="btn" id="btnStart">▶ 开始</button>
          <button class="btn sm" id="btnStop" disabled>⏹ 结束并记录</button>
        </div>
        <div class="pc-note">
          <input id="song" list="songList" type="text" maxlength="40" placeholder="练习曲目（如：《晴天》），可留空">
          <datalist id="songList"></datalist>
        </div>
        <div class="pc-note">
          <input id="note" type="text" maxlength="40" placeholder="本次练习内容备注（可选）">
        </div>
      </div>
    </section>

    <!-- 累计统计 -->
    <section class="pc-card">
      <h3><span class="em">📊</span> 累计统计</h3>
      <div class="pc-stats">
        <div class="pc-stat"><b id="stTotal">0</b><span>总练习(分)</span></div>
        <div class="pc-stat"><b id="stCount">0</b><span>练习次数</span></div>
        <div class="pc-stat"><b id="stCur">0</b><span>当前连续</span></div>
        <div class="pc-stat"><b id="stBest">0</b><span>最长连续</span></div>
      </div>
    </section>

    <!-- 近 30 天 -->
    <section class="pc-card">
      <h3><span class="em">🗓</span> 近 30 天</h3>
      <div class="pc-bars" id="bars"></div>
      <div class="pc-axis"><span id="axStart">—</span><span id="axEnd">今天</span></div>
    </section>

    <!-- 曲目练习统计 -->
    <section class="pc-card">
      <h3><span class="em">🎵</span> 曲目练习统计</h3>
      <div class="pc-songs" id="songs"></div>
    </section>

    <!-- 最近记录 -->
    <section class="pc-card">
      <h3><span class="em">📝</span> 最近记录</h3>
      <div class="pc-log" id="log"></div>
    </section>

  </div>
</main>

<script src="js/practice.js"></script>
</body>
</html>
